<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        label{
            margin-bottom: 1px;
            font-weight: bold;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
    </style>
</head>
<body>
    <h1>Student Registration Form</h1><br>
    <form>
        <label for="roll_number">Roll Number:</label>
        <input type="text" id="roll_number" name="roll_number" required><br><br>

        <label for="student_name">Student Name:</label>
        <input type="text" id="student_name" name="student_name" placeholder="First Name"required>
        <input type="text" id="last_name" name="last_name" placeholder="Last Name" required><br><br>

        <label for="father_name" id="father_name">Father's Name:</label>
        <input type="text" id="father_name" name="father_name" required><br><br>
         
        <label for="birth" id="birth">Date of birth:</label>
        <input type="text" id="birth" name="birth" required><br><br>

        <label for="mobile" id="mobile">Mobile Number:</label>
        <input type="text" id="mobile" name="mobile" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other" required>
        <label for="other">Other</label><br><br>

        <label for="department" id="department">Department:</label>
        <input type="radio" id="department" name="department" value="CS" required>
        <label for="cs">CS</label>
        <input type="radio" id="department" name="department" value="it" required>
        <label for="it">IT</label>
        <input type="radio" id="department" name="department" value="civil" required>
        <label for="civil">Civil</label>
        <input type="radio" id="department" name="department" value="mech" required>
        <label for="mech">Mech</label><br><br>

        <label for="course" id="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">Select Course</option>
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
        </select><br><br>

        <label for="student_photo">Student Photo:</label>
        <input type="file" id="student_photo" name="student_photo" accept="image/*" required><br><br>

        <label for="city">City:</label>
        <input type="text" id="city" name="city" required><br><br>

        <label for="address" id="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="50" required></textarea><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
